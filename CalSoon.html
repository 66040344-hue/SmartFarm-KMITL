<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b7a75">
  <title>กำลังพัฒนาระบบ · Cal2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #eef3f5; --card: #ffffff; --ink: #0b1a21; --muted: #587079; --line: #d6e1e6; --brand: #0b7a75; --brand-soft: #dcf2ef; --on-brand: #fff; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #050c11; --card: #0b1820; --ink: #e6f1f4; --muted: #8aa3ad; --line: #1d3340; --brand: #4fe3d3; --brand-soft: #0f2d33; --on-brand: #04201d; } }
    :root[data-theme="dark"] { --bg: #050c11; --card: #0b1820; --ink: #e6f1f4; --muted: #8aa3ad; --line: #1d3340; --brand: #4fe3d3; --brand-soft: #0f2d33; --on-brand: #04201d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 400 16px/1.5 "Chakra Petch", system-ui, sans-serif; }
    .box { max-width: 440px; width: 100%; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 36px 24px; }
    .ico { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%; background: var(--brand-soft); display: grid; place-items: center; }
    .ico svg { width: 36px; height: 36px; stroke: var(--brand); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; } p { margin: 0 0 24px; color: var(--muted); }
    a { display: inline-grid; place-items: center; min-height: 46px; padding: 0 22px; border-radius: 12px; background: var(--brand); color: var(--on-brand); font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 40%, transparent); outline-offset: 2px; }
  </style>
</head>

<body>
  <main class="box">
    <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div>
    <h1>กำลังพัฒนาระบบ</h1>
    <p>โปรแกรม Cal2 (คำนวณ + วิเคราะห์ดินเชิงลึก) <br>อยู่ระหว่างการพัฒนา<br>เร็ว ๆ นี้จะเปิดให้ใช้งาน</p>
    <a href="CalMenu.html">กลับไปเมนู</a>
  </main>
  <script>
    try { var t = JSON.parse(localStorage.getItem("cal1_theme")); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* ไม่มีค่าธีมที่เก็บไว้ */ }
  </script>
</body>

</html>
